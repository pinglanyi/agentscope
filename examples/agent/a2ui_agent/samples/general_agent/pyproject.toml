[project]
name = "general-agent"
version = "0.1.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "agentscope[a2a]",
    "agentscope-runtime",
    "uvicorn",
    "starlette",
    "fastapi",
    "shortuuid",
    "a2ui-agent-sdk",
    "opentelemetry-api>=1.36.0,<1.39.0",
    "opentelemetry-sdk>=1.36.0,<1.39.0",
    "opentelemetry-exporter-otlp>=1.36.0,<1.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
a2ui-agent-sdk = { path = "/home/wangzilong/A2UI/agent_sdks/python" }
agentscope = { path = "../../../../../" }

[tool.uv]
environments = ["python_full_version < '3.14'"]